name: Drive Image to MP4

on:
  workflow_dispatch:
  repository_dispatch:
    types: [convert_image]

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image from Google Drive
        run: |
          FILE_ID="${{ github.event.client_payload.file_id }}"
          echo "Downloading file ID: $FILE_ID"

          wget --quiet --save-cookies cookies.txt --keep-session-cookies \
          "https://docs.google.com/uc?export=download&id=$FILE_ID" -O- \
          | sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' > confirm.txt

          wget --load-cookies cookies.txt \
          "https://docs.google.com/uc?export=download&confirm=$(cat confirm.txt)&id=$FILE_ID" \
          -O image

          rm -f cookies.txt confirm.txt

      - name: Detect file type
        run: |
          file image

      - name: Rename correctly (jpg/png)
        run: |
          TYPE=$(file image)

          if [[ $TYPE == *"PNG"* ]]; then
            mv image image.png
            echo "IMAGE=image.png" >> $GITHUB_ENV
          elif [[ $TYPE == *"JPEG"* ]]; then
            mv image image.jpg
            echo "IMAGE=image.jpg" >> $GITHUB_ENV
          else
            echo "Unknown file type"
            exit 1
          fi

      - name: Convert to MP4
        run: |
          ffmpeg -y -loop 1 -i $IMAGE -vf "scale=720:1280" -t 5 -r 25 -pix_fmt yuv420p output.mp4

      - name: Validate video
        run: |
          ls -lh
          file output.mp4

      - name: Upload video to repo
        run: |
          mkdir -p videos
          cp output.mp4 videos/output.mp4

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add videos/output.mp4
          git commit -m "Update video"
          git push
