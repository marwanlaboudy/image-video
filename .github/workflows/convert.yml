name: Drive Image to MP4

on:
  workflow_dispatch:
  repository_dispatch:
    types: [convert_image]

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image from Google Drive (FIXED)
        run: |
          FILE_ID="${{ github.event.client_payload.file_id }}"
          echo "Downloading file ID: $FILE_ID"

          curl -L \
          "https://drive.google.com/uc?export=download&id=$FILE_ID&confirm=t" \
          -o image.jpg

      - name: Validate image (IMPORTANT)
        run: |
          ls -lh
          file image.jpg

      - name: Convert to MP4 (FAST + FIXED)
        run: |
          ffmpeg -y -loop 1 -i image.jpg -vf "scale=720:1280" -t 5 -r 25 -pix_fmt yuv420p output.mp4

      - name: Validate video
        run: |
          ls -lh
          file output.mp4

      - name: Upload video to repo
        run: |
          mkdir -p videos
          cp output.mp4 videos/output.mp4

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add videos/output.mp4
          git commit -m "Update video"
          git push
