name: Image to MP4

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download test image (reliable)
        run: |
          curl -L https://picsum.photos/720/1280 -o image.jpg

      - name: Debug image
        run: |
          ls -lh
          file image.jpg

      - name: Convert to MP4
        run: |
          ffmpeg -y -loop 1 -i image.jpg -t 5 -pix_fmt yuv420p output.mp4

      - name: Debug video
        run: |
          ls -lh
          file output.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: output.mp4
