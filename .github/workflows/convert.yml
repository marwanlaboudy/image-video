name: Drive Image to MP4

on:
  workflow_dispatch:
  repository_dispatch:
    types: [convert_image]

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download image from Google Drive
        run: |
          FILE_ID="${{ github.event.client_payload.file_id }}"
          echo "Downloading file ID: $FILE_ID"

          curl -L --fail --max-time 30 \
          "https://drive.google.com/uc?export=download&id=$FILE_ID&confirm=t" \
          -o image.jpg

      - name: Debug image
        run: |
          ls -lh
          file image.jpg

      - name: Convert to MP4 (FIXED 🚀)
        run: |
          ffmpeg -y -loop 1 -i image.jpg -vf "scale=720:1280" -t 5 -r 25 -pix_fmt yuv420p output.mp4

      - name: Debug video
        run: |
          ls -lh
          file output.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4.3.0
        with:
          name: video
          path: output.mp4
